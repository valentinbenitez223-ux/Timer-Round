<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diagnóstico · Timer Round</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #090d1d; color: #f7f8ff; }
      body { width: min(100% - 32px, 640px); margin: 48px auto; } h1 { margin-bottom: 6px; } p { color: #b7bfd7; }
      ul { padding: 0; list-style: none; } li { display: flex; justify-content: space-between; gap: 12px; margin: 8px 0; padding: 12px 14px; border: 1px solid #2a3457; border-radius: 12px; background: #121a33; }
      .ok { color: #52e0b1; } .fail { color: #ff91aa; } .pending { color: #ffca62; }
    </style>
  </head>
  <body>
    <h1>Diagnóstico de despliegue</h1>
    <p>Esta página verifica los archivos que necesita la PWA en el dominio actual. No carga servicios externos.</p>
    <ul id="checks"><li><span>Inicializando…</span><strong class="pending">Pendiente</strong></li></ul>
    <script>
      const assets = ['index.html', 'app.js', 'styles.css', 'manifest.json', 'sw.js', 'icon.svg'];
      const checks = document.getElementById('checks');
      const status = (name, ok, detail) => `<li><span>${name}${detail ? ` · ${detail}` : ''}</span><strong class="${ok ? 'ok' : 'fail'}">${ok ? 'OK' : 'Error'}</strong></li>`;
      Promise.all(assets.map(async asset => {
        try { const response = await fetch(asset, { cache: 'no-store' }); return status(asset, response.ok, response.status); }
        catch (error) { return status(asset, false, 'sin respuesta'); }
      })).then(rows => {
        rows.push(status('Service worker', 'serviceWorker' in navigator, 'serviceWorker' in navigator ? 'compatible' : 'no compatible'));
        checks.innerHTML = rows.join('');
      });
    </script>
  </body>
</html>
